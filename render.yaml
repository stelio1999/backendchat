services:
  - type: web
    name: whatsapp-clone-backend
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: whatsapp-redis
          property: connectionString
    healthCheckPath: /health
    autoDeploy: true

  - type: redis
    name: whatsapp-redis
    plan: starter

  - type: worker
    name: whatsapp-worker
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: whatsapp-redis
          property: connectionString